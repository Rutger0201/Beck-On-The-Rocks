<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Rutger · Beck on the Rocks</title>
  <meta name="description" content="Digitaal visitekaartje van Rutger, cocktail bartender bij Beck on the Rocks.">
  <meta name="theme-color" content="#0f0d0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

<body>
<!-- Digitaal visitekaartje. Zet op je NFC-tag: https://beckontherocks.nl/kaart/?ref=nfc -->
<main class="kaart">
  <div class="kaart__inner">
    <picture>
      <source type="image/webp" srcset="/assets/img/w/logo-dark-300.webp 300w, /assets/img/w/logo-dark-600.webp 600w" sizes="180px">
      <img class="kaart__logo" src="/assets/img/w/logo-dark-300.png" alt="Beck on the Rocks" width="300" height="203">
    </picture>
    <h1>Rutger</h1>
    <p class="kaart__rol">Cocktail bartender op locatie</p>
    <div class="kaart__knoppen">
      <a class="btn" href="/?via=visitekaartje#boeken">Vraag vrijblijvend een offerte aan</a>
      <a class="btn btn--ghost" href="/">Bekijk de website</a>
      <div class="kaart__duo">
        <a class="btn btn--ghost" href="tel:+31639658662">Bellen</a>
        <a class="btn btn--ghost" href="https://wa.me/31639658662" target="_blank" rel="noopener">WhatsApp</a>
      </div>
      <div class="kaart__duo">
        <a class="btn btn--ghost" href="mailto:rutger@beck.nl">Mail</a>
        <a class="btn btn--ghost" href="/kaart/rutger-beck-on-the-rocks.vcf" download>Opslaan in contacten</a>
      </div>
    </div>
    <div class="kaart__qr"><img src="/assets/img/qr-beckontherocks.svg" alt="QR-code naar beckontherocks.nl" width="264" height="264"></div>
    <small>Scan de code met je camera, of ga naar beckontherocks.nl</small>
  </div>
</main>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/main.js" defer></script>
