<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina niet gevonden · Beck on the Rocks</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon-48.png">
  <style>
    :root { --bg: #0f0d0b; --text: #efe8dc; --muted: #a89f92; --gold: #c9a45c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 300 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px 16px; }
    img { width: 120px; height: auto; margin-bottom: 1.5rem; }
    h1 { font: 500 2.4rem/1.1 Georgia, serif; margin: 0 0 .6rem; }
    h1 em { color: var(--gold); }
    p { color: var(--muted); margin: 0 0 2rem; }
    a { display: inline-block; padding: .9em 1.8em; border-radius: 999px; background: var(--gold); color: #17120b; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo-mark.png" alt="">
    <h1>Deze pagina is <em>leeg geschonken.</em></h1>
    <p>De pagina die je zoekt bestaat niet (meer).</p>
    <a href="/">Naar de homepage</a>
  </main>
</body>
</html>
