<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina niet gevonden · Beck on the Rocks</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon-48.png">
  <meta name="theme-color" content="#f1ebe1">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    :root { --bg: #f1ebe1; --text: #1c1a17; --muted: #5b544a; --accent: #7e6038; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 300 17px/1.6 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px 16px; }
    img { width: 96px; height: auto; margin: 0 auto 1.8rem; filter: brightness(.62) saturate(.9); }
    h1 { font: 300 clamp(2.4rem, 7vw, 3.6rem)/1.05 "Cormorant Garamond", Georgia, serif; margin: 0 0 .8rem; text-wrap: balance; }
    h1 em { color: var(--accent); }
    p { color: var(--muted); margin: 0 0 2.2rem; }
    a { display: inline-flex; align-items: center; gap: 16px; min-height: 52px; padding: 0 26px; background: var(--text); color: #faf7f2; text-decoration: none;
        font: 500 .76rem "Jost", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; border-radius: 2px; }
    a::after { content: ""; width: 24px; height: 1px; background: currentColor; }
    a:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo-mark.png" alt="">
    <h1>Deze pagina is <em>leeg geschonken.</em></h1>
    <p>De pagina die je zoekt bestaat niet (meer).</p>
    <a href="/">Naar de homepage</a>
  </main>
</body>
</html>
