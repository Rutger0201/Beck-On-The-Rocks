# Zet de goedgekeurde reviews uit reviews/ in één bestand voor de site (tools/reviews_index.py).
# Draait vanzelf als je een review goedkeurt of verwijdert.
name: Reviews bijwerken
on:
  push:
    branches: [main]
    paths: ['reviews/**', 'tools/reviews_index.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: reviews
jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bijwerken en opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Steeds opnieuw opbouwen vanaf de nieuwste main: zo mist het bestand nooit een net goedgekeurde review
          # Een kapot reviewbestand wordt overgeslagen; de goede reviews gaan wel door, maar de Action wordt rood
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            fout=0; python3 tools/reviews_index.py || fout=1
            git add assets/data/reviews.json
            if git diff --cached --quiet; then echo "Niets nieuws."; exit $fout; fi
            git commit -qm "Reviews bijgewerkt"
            git push origin HEAD:main && exit $fout
            sleep 10
          done
          exit 1
