# Zoekt op maandag en donderdag mogelijke klussen voor de adminpagina (tools/events.py)
name: Events zoeken
on:
  schedule:
    - cron: '23 5 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency: events
jobs:
  zoeken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zoeken en versleuteld opslaan
        env:
          ADMIN_WACHTWOORD: ${{ secrets.ADMIN_WACHTWOORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet -r tools/requirements.txt
          python3 tools/events.py
          git add assets/data/events.enc.json
          if git diff --cached --quiet; then echo "Niets nieuws."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Events bijgewerkt"
          # Tegelijk een andere bot-commit op main? Dan eerst bijwerken en opnieuw proberen.
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
