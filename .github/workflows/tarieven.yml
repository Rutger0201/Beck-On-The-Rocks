# Past iemand tarieven.json aan, dan zet deze actie alle bedragen op de site goed (tools/tarieven.py)
name: Tarieven bijwerken
on:
  push:
    branches: [main]
    paths: ['tarieven.json', 'tools/tarieven.py']
  pull_request:
    paths: ['**.html', 'tarieven.json', 'tools/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controleren:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Controleren (pull request)
        run: |
          python3 tools/tarieven.py --controleer
          python3 tools/csp_controle.py
          python3 -m py_compile tools/*.py tools/marketing/*.py
  bijwerken:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Alleen deze job mag commits terugzetten op main; één tegelijk
    concurrency: tarieven
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Bijwerken en opslaan (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Steeds opnieuw opbouwen vanaf de nieuwste main: zo wint nooit een oudere versie van tarieven.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/tarieven.py
            if git diff --quiet; then echo "Alle tarieven klopten al."; exit 0; fi
            git commit -qam "Tarieven bijgewerkt vanuit tarieven.json"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
