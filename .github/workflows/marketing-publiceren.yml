# Plaatst elk uur de posts die je op de adminpagina hebt goedgekeurd, ingepland en op "Automatisch plaatsen" gezet
# (tools/marketing/publiceren.py). Zonder koppelingen (secrets) of zonder ingeplande posts doet hij niets.
name: Marketing publiceren
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      proef:
        description: Alleen laten zien wat geplaatst zou worden
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: marketing-publiceren
  cancel-in-progress: false
jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Ingeplande posts plaatsen
        env:
          ADMIN_WACHTWOORD: ${{ secrets.ADMIN_WACHTWOORD }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
          PROEF: ${{ inputs.proef && '--proef' || '' }}
        run: |
          pip install --quiet cryptography
          python3 tools/marketing publiceer $PROEF
          git add assets/data/marketing-publicaties.enc.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Marketing: gepubliceerd"
          # Het log moet erin, anders wordt een post het volgende uur opnieuw geplaatst.
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
