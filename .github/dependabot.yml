# Dependabot: maakt vanzelf een pull request als een gebruikte GitHub Action een (beveiligings)update heeft.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Python-pakketten van de Actions (tools/requirements.txt)
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
